[package]
name = "callosa"
version = "0.1.0"
edition = "2021"
description = "Half a transformer per browser tab, with activations crossing a WebRTC data channel"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
futures-channel = "0.3"
wgpu = { version = "23.0", default-features = false, features = ["wgsl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "23.0", default-features = false, features = ["webgpu"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# The entire client lives in Rust, so the web-sys surface is broad: DOM, canvas,
# WebRTC and BroadcastChannel are all driven from here rather than from JS.
[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "HtmlButtonElement",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "DomRect",
  "DomStringMap",
  "CssStyleDeclaration",
  "Performance",
  "Event",
  "EventTarget",
  "MessageEvent",
  "Navigator",
  "Location",
  "Url",
  "UrlSearchParams",
  "BroadcastChannel",
  "Clipboard",
  "RtcPeerConnection",
  "RtcConfiguration",
  "RtcIceServer",
  "RtcDataChannel",
  "RtcDataChannelInit",
  "RtcDataChannelEvent",
  "RtcDataChannelState",
  "RtcDataChannelType",
  "RtcPeerConnectionIceEvent",
  "RtcIceCandidate",
  "RtcIceCandidateInit",
  "RtcSessionDescription",
  "RtcSessionDescriptionInit",
  "RtcSdpType",
  "RtcPeerConnectionState",
  "RtcIceGatheringState",
  "RtcSignalingState",
  "RtcIceConnectionState",
]

# Native backends exist purely so `cargo test` can execute the real WGSL kernels
# against the CPU reference implementation on a developer machine.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "23.0", default-features = false, features = ["dx12", "metal"] }

[dev-dependencies]
pollster = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
